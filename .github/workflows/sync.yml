name: IPTVINDEX
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate db.json
        run: |
          mkdir -p dist
          echo '{"lives":[{"name":"直播源","url":"https://ghfast.top/https://raw.githubusercontent.com/yangh909/iptv-api/master/output/result.txt"}],
          "stores":[{"name":"肥猫仓库","url":"http://肥猫.live"},
          {"name":"饭太硬仓库","url":"http://饭太硬.top/tv"},
          {"name":"游魂仓库","url":"https://www.iyouhun.com/tv/0"},
          {"name":"欧歌仓库","url":"https://m.nxog.top/nxog/ou1.php?url=http://tv.nxog.top&b=欧歌"},
          {"name":"俊哥仓库","url":"http://home.jundie.top:81/top98.json"}],
          "parses":[{"name":"通用解析","url":"https://jx.qqzi.cn/jx.php?url="}]}' 
          > dist/db.json
      
      - uses: EndBug/add-and-commit@v9
        with:
          message: Update
          add: dist/db.json

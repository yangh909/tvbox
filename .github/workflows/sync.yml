name: Build IPTVINDEX Format db.json
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate db.json
        run: |
          mkdir -p dist
          echo '{"urls":[{"name":"260517","url":"http://www.饭太硬.cc/tv"},{"name":"王二小","url":"https://9280.kstore.vip/newwex.json"},{"name":"肥猫","url":"http://肥猫.live"},{"name":"游魂","url":"https://www.iyouhun.com/tv/0"},{"name":"欧歌","url":"https://m.nxog.top/nxog/ou1.php?url=http://tv.nxog.top&b=欧歌"}]}' > dist/db.json

      - name: Commit Update
        uses: EndBug/add-and-commit@v9
        with:
          message: Update db.json
          add: dist/db.json
          committer_name: GitHub Actions
          committer_email: actions@github.com

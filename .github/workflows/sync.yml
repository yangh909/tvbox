name: TVBOX 地址自动同步

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 拉取最新 TVBOX 仓库地址
        run: |
          mkdir -p dist
          curl -L -s "https://github.com/tvbox-me/tvbox-repo/raw/main/repo.json" -o dist/tvbox.json
          echo "✅ TVBOX 地址拉取完成"

      - name: 提交并推送更新
        uses: EndBug/add-and-commit@v9
        with:
          message: "🤖 自动更新 TVBOX 地址"
          add: "dist/*"

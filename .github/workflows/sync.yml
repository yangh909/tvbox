name: 生成 IPTVINDEX 标准格式 db.json
on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时执行一次
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整仓库，避免提交失败

      - name: 生成标准 db.json
        run: |
          mkdir -p dist
          # 写入标准 JSON 格式
          cat > dist/db.json << 'EOF'
          {
              "urls": [{"name":"自动更新源","url":"https://ghproxy.net/raw.githubusercontent.com/yangh909/tvbox-sync/main/dist/tvbox.json"}],
              "sites": [
                  {"key":"bilibili","name":"哔哩哔哩","type":3,"api":"https://mirror.ghproxy.com/https://raw.githubusercontent.com/gaotianliuyun/gao/master/哔哩哔哩.js","searchable":1,"quickSearch":1},
                  {"key":"wanxiang","name":"万向影视","type":3,"api":"https://mirror.ghproxy.com/https://raw.githubusercontent.com/gaotianliuyun/gao/master/万向影视.js","searchable":1,"quickSearch":1}
              ],
              "parses": [{"name":"通用解析","url":"https://jx.qqzi.cn/jx.php?url="}]
          }
          EOF

      - name: 提交更新到仓库
        uses: EndBug/add-and-commit@v9
        with:
          message: "✅ 自动更新 tvbox.json"
          add: "dist/db.json"  # 精确指定文件，更安全
          committer_name: GitHub Actions
          committer_email: actions@github.com
